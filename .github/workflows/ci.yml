name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - run: go run ./cmd/demo
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: bootstrap
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Provision the disposable database
        env:
          PGPASSWORD: bootstrap
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f deploy/postgres/schema.sql -f deploy/postgres/10-demo.sql
      - run: go test -race -count=1 -tags=integration ./...
        env:
          LEDGER_TEST_DSN: postgres://ledger_demo:local-demo-only@localhost/postgres?sslmode=disable
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T ledger ledgerctl demo
      - run: docker compose restart ledger && docker compose up -d --wait
      - run: docker compose exec -T ledger ledgerctl verify
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  image:
    needs: [test, postgres, compose]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build --label org.opencontainers.image.source=https://github.com/q133ss/cryptoledger -t ghcr.io/q133ss/cryptoledger:"$GITHUB_REF_NAME" .
          docker push ghcr.io/q133ss/cryptoledger:"$GITHUB_REF_NAME"
