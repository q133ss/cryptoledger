services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: local-bootstrap-only
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/postgres/10-demo.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger && psql -U postgres -d ledger -tAc 'SELECT 1 FROM finance.transactions LIMIT 0'"]
      interval: 2s
      timeout: 3s
      retries: 30
  ledger:
    build: .
    environment:
      LEDGER_DSN: postgres://ledger_demo:local-demo-only@postgres/ledger?sslmode=disable
    command: ["-seed", "-addr", "0.0.0.0:50051", "-http-addr", "0.0.0.0:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEDGER_PORT:-50051}:50051"
      - "127.0.0.1:${LEDGER_HTTP_PORT:-8081}:8081"
    volumes:
      - identity:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db:
  identity:
